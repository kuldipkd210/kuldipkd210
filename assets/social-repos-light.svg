<svg xmlns="http://www.w3.org/2000/svg" width="172" height="46" viewBox="0 0 172 46" role="img" aria-label="All repositories">
<title>All repositories</title>
<style>
text{font-family:'Inter','Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 42s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
.wave{animation:wave 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(10deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="171" height="45" rx="22.5" fill="#eef2ff" stroke="#d6dff5"/>
<rect x="18" y="14" width="7" height="7" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/><rect x="28" y="14" width="7" height="7" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/><rect x="18" y="24" width="7" height="7" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/><rect x="28" y="24" width="7" height="7" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/>
<text x="44" y="28" fill="#0f172a" font-size="14" font-weight="700">All repositories</text>
</svg>