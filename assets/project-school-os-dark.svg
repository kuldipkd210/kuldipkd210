<svg xmlns="http://www.w3.org/2000/svg" width="412" height="214" viewBox="0 0 412 214" role="img" aria-label="School OS">
<title>School OS</title>
<style>
text{font-family:'Inter','Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 42s linear infinite}
.spin-r{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite reverse}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
.wave{animation:wave 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(10deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<clipPath id="pc"><rect width="412" height="214" rx="24"/></clipPath>
<rect width="412" height="214" rx="24" fill="#131722"/>
<g clip-path="url(#pc)">
  <circle class="breathe" cx="380" cy="194" r="46" fill="#292f56" opacity="0.65"/>
  <rect x="26" y="26" width="38" height="38" rx="12" fill="#1b2131" stroke="#2a324b"/>
  <circle cx="45" cy="45" r="7" fill="#a855f7"/>
  <rect x="315" y="32" width="71" height="24" rx="12" fill="#2b3058"/>
  <text x="350.5" y="48" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">Equantra</text>

  <text x="26" y="96" fill="#f1f5f9" font-size="19" font-weight="800" letter-spacing="-0.3">School OS</text>
  <text x="26" y="124" fill="#94a3b8" font-size="13.5" font-weight="500">Multi-tenant K-12 SaaS across 12+ modules</text>
  <text x="26" y="144" fill="#94a3b8" font-size="13.5" font-weight="500">with CSP solvers, Typst PDFs &amp; LLM assistant.</text>

  <circle cx="33" cy="180" r="5" fill="#a855f7"/>
  <text x="45" y="184.5" fill="#64748b" font-size="12.5" font-weight="700">Elixir · Phoenix · Ash</text>
</g>
<rect x="0.5" y="0.5" width="411" height="213" rx="23.5" fill="none" stroke="#2a324b"/>
</svg>