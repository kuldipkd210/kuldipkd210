<svg xmlns="http://www.w3.org/2000/svg" width="840" height="222" viewBox="0 0 840 222" role="img" aria-label="About me">
<title>About me</title>
<style>
text{font-family:'Space Grotesk','Host Grotesk','Segoe UI',system-ui,-apple-system,sans-serif}
.mono{font-family:'JetBrains Mono','IBM Plex Mono','SFMono-Regular',Consolas,monospace}
.pulse{stroke-dasharray:10 18;animation:flow 2.8s linear infinite}
.pulse-slow{stroke-dasharray:8 22;animation:flow 4.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-56}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="839" height="221" rx="6" fill="#fbfaf7" stroke="#d9d3c7"/>
<line x1="436" y1="20" x2="436" y2="202" stroke="#d9d3c7" stroke-width="1"/>

<rect x="32" y="34" width="18" height="3" fill="#c2410c"/>
<text x="32" y="64" fill="#181614" font-size="21" font-weight="700" letter-spacing="-0.4">About me</text>

<text x="32" y="102" fill="#45413b" font-size="14.5" font-weight="500">I am a backend and full-stack engineer focused on</text>
<text x="32" y="124" fill="#45413b" font-size="14.5" font-weight="500">high-concurrency Elixir systems, Python ML workflows,</text>
<text x="32" y="146" fill="#45413b" font-size="14.5" font-weight="500">and fast web products built with Ruby on Rails 8.</text>

<text x="32" y="184" fill="#736d64" font-size="12.5" font-weight="500">Open to backend, full-stack, and AI engineering work.</text>

<text x="464" y="46" class="mono" fill="#ea580c" font-size="12" font-weight="700">01</text><text x="494" y="46" fill="#181614" font-size="14" font-weight="600">Backend architecture</text><text x="494" y="66" fill="#736d64" font-size="12.5">Multi-tenant Postgres, Ash domains, Oban jobs</text><line x1="464" y1="80" x2="808" y2="80" stroke="#d9d3c7" stroke-width="1"/><text x="464" y="110" class="mono" fill="#ea580c" font-size="12" font-weight="700">02</text><text x="494" y="110" fill="#181614" font-size="14" font-weight="600">Real-time &amp; web UI</text><text x="494" y="130" fill="#736d64" font-size="12.5">Phoenix LiveView, Channels, Rails 8 &amp; Hotwire</text><line x1="464" y1="144" x2="808" y2="144" stroke="#d9d3c7" stroke-width="1"/><text x="464" y="174" class="mono" fill="#ea580c" font-size="12" font-weight="700">03</text><text x="494" y="174" fill="#181614" font-size="14" font-weight="600">Applied AI &amp; vision</text><text x="494" y="194" fill="#736d64" font-size="12.5">LLM tool agents, MCP servers, CNNs &amp; OpenCV</text>
</svg>