<svg xmlns="http://www.w3.org/2000/svg" width="161" height="42" viewBox="0 0 161 42" role="img" aria-label="All repositories">
<title>All repositories</title>
<style>
text{font-family:'Space Grotesk','Host Grotesk','Segoe UI',system-ui,-apple-system,sans-serif}
